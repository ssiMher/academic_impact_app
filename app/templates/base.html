<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Academic Impact App{% endblock %}</title>
    {% set static_asset_version = "20260727-ieee-session-v4" %}
    <link rel="stylesheet" href="/static/css/app.css?v={{ static_asset_version }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      {% include "components/nav.html" %}
      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="/static/js/app.js?v={{ static_asset_version }}" defer></script>
  </body>
</html>
